name: Daily News Summarizer

on:
  schedule:
    - cron: '0 23 * * *' # KST 아침 8시
  workflow_dispatch:

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          pip install google-genai feedparser

      - name: 뉴스 요약 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: GitHub 저장소에 결과 파일 업데이트
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news_summary.txt
          git commit -m "Update daily news summary" || exit 0
          git push
