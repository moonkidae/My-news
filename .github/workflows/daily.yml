name: Daily News Summarizer

on:
  schedule:
    # UTC 기준 23:00 = 한국 시간(KST) 매일 아침 8:00
    - cron: '0 23 * * *'
  workflow_dispatch: # 직접 실행(테스트) 버튼 활성화

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 패키지 설치
        run: |
          pip install google-genai feedparser

      - name: 뉴스 수집 및 Gemini 요약 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: 요약 결과 저장
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news_summary.txt
          git commit -m "Update daily news summary" || exit 0
          git push
